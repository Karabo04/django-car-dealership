{% extends 'cars/base.html' %}
{% block content %}
<h2 style="margin-bottom:20px;">Customers</h2>
<div class="card-modern">
<table class="table-modern">
<tr><th>NAME</th><th>PHONE</th><th>EMAIL</th><th>ACTION</th></tr>
{% for customer in customers %}
<tr><td>{{ customer.name }}</td><td>{{ customer.phone }}</td><td>{{ customer.email }}</td><td><a href="{%url 'customer_view' customer.id%}" class="btn-view">View</a></td></tr>
{% endfor %}
</table>
</div>
{% endblock %}
